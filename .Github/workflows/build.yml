name: Build JJS plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build jjs
      - name: Package zip (manifest.json + index.js na raiz)
        run: |
          mkdir -p out
          cp plugins/jjs/manifest.json out/
          cp plugins/jjs/build/js/index.js out/
          cd out && zip -r ../ibnaltayyib.jjs@1.0.0.zip manifest.json index.js
      - uses: actions/upload-artifact@v4
        with:
          name: jjs-plugin
          path: ibnaltayyib.jjs@1.0.0.zip
          
